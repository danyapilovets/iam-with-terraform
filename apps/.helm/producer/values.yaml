replicaCount: 1

image:
  repository: ghcr.io/danyapilovets/producer
  tag: "1.0.0"
  pullPolicy: Always

# 🔥 УРЕЗАНЫ РЕСУРСЫ для 6GB RAM системы
resources:
  limits:
    cpu: 300m        # Урезано с 500m
    memory: 384Mi    # Урезано с 512Mi
  requests:
    cpu: 150m        # Урезано с 200m
    memory: 192Mi    # Урезано с 256Mi

service:
  type: ClusterIP
  port: 8001

kafka:
  bootstrapServers: kafka:9092
  topic: events.taxonomy

postgres:
  # Credentials will be injected from postgres-secret via External Secrets
  # from AWS Secrets Manager: dev-iwt-postgres-creds
  host: postgres
  port: 5432
