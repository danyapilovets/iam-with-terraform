apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-scripts
  namespace: dev
data:
  01-init-tables.sql: |
    CREATE TABLE IF NOT EXISTS Events (
        id SERIAL PRIMARY KEY,
        type varchar(255),
        team_1 varchar(255),
        team_2 varchar(255),
        event_date varchar(255),
        score varchar(50),
        state varchar(50)
        CONSTRAINT check_state
        CHECK(state IN('created', 'active', 'finished'))
    );

    CREATE TABLE IF NOT EXISTS sale (
        id SERIAL PRIMARY KEY,
        order_date DATE,
        order_status_name VARCHAR(100),
        amount DECIMAL(10,2),
        customer_id INTEGER
    );

    CREATE TABLE IF NOT EXISTS order_status_stats (
        dt DATE,
        order_status_name VARCHAR(100),
        orders_count INTEGER,
        PRIMARY KEY (dt, order_status_name)
    );
  02-fill-sample-data.sql: |
    INSERT INTO Events (type, team_1, team_2, event_date, score, state) VALUES
    ('transaction', 'user_123', 'merchant_456', '2024-01-19', '250.00', 'finished'),
    ('transaction', 'user_789', 'merchant_101', '2024-01-19', '75.50', 'finished'),
    ('transaction', 'user_456', 'merchant_789', '2024-01-19', '1200.00', 'created')
    ON CONFLICT DO NOTHING;

    INSERT INTO sale (order_date, order_status_name, amount, customer_id) VALUES
    ('2024-01-19', 'completed', 250.00, 123),
    ('2024-01-19', 'pending', 75.50, 789), 
    ('2024-01-19', 'completed', 1200.00, 456),
    ('2024-01-18', 'completed', 500.00, 321),
    ('2024-01-18', 'cancelled', 150.00, 654)
    ON CONFLICT DO NOTHING; 