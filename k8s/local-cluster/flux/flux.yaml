---
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: dev-repo
  namespace: flux-system
spec:
  interval: 30s
  url: https://github.com/danyapilovets/iam-with-terraform
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dev-apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./k8s/local-cluster/environments
  prune: true
  sourceRef:
    kind: GitRepository
    name: dev-repo
  timeout: 2m
