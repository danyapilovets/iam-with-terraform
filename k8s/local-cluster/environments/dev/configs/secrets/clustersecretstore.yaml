apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-central-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-secret
            namespace: dev
            key: access_key
          secretAccessKeySecretRef:
            name: aws-secret
            namespace: dev
            key: secret_key 