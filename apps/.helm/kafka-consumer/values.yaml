image:
  repository: kafka-s3-consumer
  tag: 1.0.0
  pullPolicy: IfNotPresent

replicaCount: 1

resources:
  limits:
    cpu: 200m      # Минимум для Python app
    memory: 256Mi  # Минимум для Consumer
  requests:
    cpu: 100m
    memory: 128Mi

s3Bucket: dev-iwt-private
awsSecret: kafka-consumer-secret  # Используем правильный секрет
awsRegion: eu-central-1

# Kafka настройки
kafka:
  bootstrapServers: "kafka:9092"
  topic: "events.taxonomy"
  consumerGroup: "banking-consumer-dev"
