# =============================================================================
# ЛОКАЛЬНАЯ ИМИТАЦИЯ AWS SECRETS MANAGER ДЛЯ DEVELOPMENT
# В продакшене эти секреты должны быть созданы через AWS CLI/Terraform:
#
# aws secretsmanager create-secret \
#   --name "dev/kafka-consumer-config" \
#   --description "Kafka Consumer configuration for banking ETL" \
#   --secret-string '{
#     "aws_access_key_id": "REAL_ACCESS_KEY",
#     "aws_secret_access_key": "REAL_SECRET_KEY", 
#     "aws_region": "eu-central-1",
#     "s3_bucket": "dev-iwt-private-bucket",
#     "s3_prefix": "landing/card_tx/",
#     "kafka_bootstrap_servers": "kafka:9092",
#     "kafka_topic": "card_tx",
#     "kafka_consumer_group": "card-tx-s3-writer"
#   }'
# =============================================================================

---
# Имитация структуры AWS Secrets Manager локально
apiVersion: v1  
kind: Secret
metadata:
  name: mock-aws-secrets
  namespace: dev
  labels:
    mock-aws-secret: "dev/kafka-consumer-config"
type: Opaque
stringData:
  # Структура как в AWS Secrets Manager
  aws_access_key_id: "AKIAIOSFODNN7EXAMPLE"
  aws_secret_access_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
  aws_region: "eu-central-1"
  s3_bucket: "dev-iwt-private-bucket"  
  s3_prefix: "landing/card_tx/"
  kafka_bootstrap_servers: "kafka:9092"
  kafka_topic: "card_tx"
  kafka_consumer_group: "card-tx-s3-writer"

---
# AWS Credentials для подключения к Secrets Manager
# В продакшене использовать IRSA (IAM Roles for Service Accounts)
apiVersion: v1
kind: Secret
metadata:
  name: aws-credentials
  namespace: dev
type: Opaque  
stringData:
  # Для локального dev - можно использовать LocalStack credentials
  access_key_id: "test"
  secret_access_key: "test" 