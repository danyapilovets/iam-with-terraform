apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aws-consumer-secret
  namespace: dev
spec:
  secretStoreRef:
    name: aws-secretsmanager
    kind: ClusterSecretStore
  target:
    name: aws-consumer-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: dev-iwt-kafka-consumer-creds 