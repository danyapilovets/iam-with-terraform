image:
  repository: ghcr.io/danyapilovets/kafka-consumer
  tag: "1.0.1"
  pullPolicy: Always

replicaCount: 1

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

s3Bucket: dev-iwt-private
awsSecret: kafka-consumer-secret
awsRegion: eu-central-1

kafka:
  bootstrapServers: "kafka:9092" 
  topic: "banking.transactions"
  consumerGroup: "banking-consumer-dev"
