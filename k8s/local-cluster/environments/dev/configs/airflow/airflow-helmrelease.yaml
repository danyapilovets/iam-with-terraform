apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: airflow
  namespace: dev
spec:
  interval: 5m
  chart:
    spec:
      chart: apps/.helm/airflow
      sourceRef:
        kind: GitRepository
        name: dev-repo
        namespace: flux-system
  values:
    airflow:
      executor: "LocalExecutor"
      postgresql:
        enabled: false
      redis:
        enabled: false
      workers:
        replicas: 0
      triggerer:
        enabled: false
      statsd:
        enabled: false
      serviceAccount:
        create: false
        name: "airflow-serviceaccount"
      scheduler:
        replicas: 1
      webserver:
        replicas: 1
