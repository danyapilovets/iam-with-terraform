apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: airflow
  namespace: dev
spec:
  interval: 5m
  chart:
    spec:
      chart: apps/airflow/.charts/airflow-0.0.1.tgz
      sourceRef:
        kind: GitRepository
        name: dev-repo
        namespace: flux-system
  values:
    # 🔥 ULTRA-LIGHT AIRFLOW для 6GB RAM
    executor: LocalExecutor  # НЕ Celery! Экономим ресурсы
    
    # Минимальный webserver
    webserver:
      replicas: 1
      resources:
        limits:
          memory: 512Mi    # Урезано с 1Gi
          cpu: 300m        # Урезано с 500m
        requests:
          memory: 256Mi    # Урезано с 512Mi
          cpu: 150m        # Урезано с 250m
    
    # Минимальный scheduler
    scheduler:
      replicas: 1
      resources:
        limits:
          memory: 512Mi    # Урезано с 1Gi
          cpu: 300m        # Урезано с 500m
        requests:
          memory: 256Mi    # Урезано с 512Mi
          cpu: 150m        # Урезано с 250m
    
    # БЕЗ PostgreSQL! Используем SQLite для dev
    postgresql:
      enabled: false
    
    # БЕЗ Redis! LocalExecutor не нужен Redis
    redis:
      enabled: false
      
    # БЕЗ Workers! LocalExecutor
    workers:
      enabled: false
    
    # Минимальная конфигурация
    airflow:
      config:
        core:
          executor: LocalExecutor
          load_examples: false
          max_active_runs_per_dag: 1
          dagbag_import_timeout: 30
        webserver:
          workers: 1               # Минимум workers
          worker_refresh_interval: 60
        scheduler:
          catchup_by_default: false
          max_threads: 2           # Минимум threads
