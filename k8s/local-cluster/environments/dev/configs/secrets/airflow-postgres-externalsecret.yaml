apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: airflow-postgres-secret
  namespace: dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secretsmanager
  target:
    name: postgres-secret
    creationPolicy: Merge  # Добавляем к существующему postgres-secret
  dataFrom:
  - extract:
      key: dev-iwt-postgres-creds
  data:
  # Создаем connection string для Airflow из компонентов PostgreSQL секрета
  - secretKey: AIRFLOW_DB_CONN
    remoteRef:
      key: dev-iwt-postgres-creds
      property: connection_string  # Предполагаем что в AWS есть готовая строка подключения
---
# 🔐 Шаблон для создания connection string из компонентов AWS секрета
  template:
    type: Opaque
    data:
      AIRFLOW_DB_CONN: |
        postgresql+psycopg2://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASSWORD }}@{{ .host }}:{{ .port }}/{{ .POSTGRES_DB }} 