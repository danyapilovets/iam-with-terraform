apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kafka
  namespace: dev
spec:
  interval: 5m
  chart:
    spec:
      chart: kafka
      version: 26.4.0
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    replicaCount: 1  
    resources:
      limits:
        memory: 1Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 500m

    jvmOpts: "-Xms256m -Xmx512m"
    
    metrics:
      kafka:
        enabled: false
      jmx:
        enabled: false
    
    # Простая конфигурация логов  
    logRetentionBytes: 1073741824  # 1GB вместо дефолтных
    logRetentionHours: 168  # 7 дней
    
    # Минимальные настройки персистентности
    persistence:
      size: 2Gi  # Маленький диск для dev
