name: Build and Publish Docker Images

on:
  push:
    branches: [main, feature/iwt]
    paths:
      - 'apps/.helm/producer/**'
      - 'apps/.docker/kafka-s3-consumer/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-producer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Push Producer Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/.helm/producer
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/producer:1.0.0
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/producer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-consumer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and Push Consumer Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/.docker/kafka-s3-consumer
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/kafka-consumer:1.0.0
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/kafka-consumer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max 