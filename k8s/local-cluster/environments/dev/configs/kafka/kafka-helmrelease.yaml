apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: kafka
  namespace: dev
spec:
  interval: 5m
  chart:
    spec:
      chart: kafka
      version: 26.4.0
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system
  values:
    replicaCount: 1
    resources:
      limits:
        memory: 768Mi
        cpu: 600m
      requests:
        memory: 384Mi
        cpu: 300m
    jvmOpts: "-Xms128m -Xmx384m"
    metrics:
      kafka:
        enabled: false
      jmx:
        enabled: false
    logRetentionBytes: 268435456
    logRetentionHours: 24
    persistence:
      size: 1Gi
    deleteTopicEnable: true
    autoCreateTopicsEnable: true
    numNetworkThreads: 2
    numIoThreads: 2
