apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: dev
spec:
  interval: 5m
  chart:
    spec:
      chart: external-secrets/external-secrets
      version: 0.9.4
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
      interval: 30m
  install:
    createNamespace: true
  values:
    installCRDs: true 